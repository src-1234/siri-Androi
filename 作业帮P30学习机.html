<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>作业帮 P30 学习机</title>
<style>
/* ============ 基础与等比缩放舞台 ============ */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; overflow:hidden; background:#0a0e1f;
  'font-family':"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
#stage { position:absolute; left:50%; top:50%; width:1180px; height:820px;
  'transform-origin':center center; overflow:hidden; border-radius:24px; }
section { position:absolute; inset:0; display:none; }
section.on { display:block; }
button { font-family:inherit; border:none; background:none; cursor:pointer; }

/* ============ 锁屏页：深空渐变 ============ */
#view-lock { background:linear-gradient(160deg,#1b1038 0%,#101a44 45%,#0a1330 100%); }
#stars { position:absolute; inset:0; }
.star { position:absolute; border-radius:50%; background:#fff; animation:twinkle 2.4s ease-in-out infinite; }
@keyframes twinkle { 0%,100%{opacity:.15} 50%{opacity:.95} }
.deco { position:absolute; animation:float 5s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
.lock-time { position:absolute; top:120px; left:0; right:0; text-align:center;
  'font-size':120px; font-weight:800; color:#e9edff; letter-spacing:4px; line-height:1; }
.lock-date { position:absolute; top:262px; left:0; right:0; text-align:center;
  'font-size':30px; color:#c7d0f2; letter-spacing:2px; }
#lock-mascot { position:absolute; left:50%; top:330px; transform:translateX(-50%);
  width:300px; height:330px; }
.lock-hint { position:absolute; bottom:34px; left:0; right:0; text-align:center;
  'font-size':20px; color:#93a0d8; animation:hintUp 1.6s ease-in-out infinite; }
@keyframes hintUp { 0%,100%{opacity:.5; transform:translateY(0)} 50%{opacity:1; transform:translateY(-8px)} }
.lock-bar { position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
  width:140px; height:5px; border-radius:3px; background:#ffffff55; }

/* ============ 锁定页：休息时间 ============ */
#view-restrict { background:#000; }
.restrict-time { position:absolute; top:110px; left:0; right:0; text-align:center;
  'font-size':110px; font-weight:700; color:#3a3a3a; letter-spacing:4px; }
.restrict-popup { position:absolute; top:300px; left:50%; transform:translateX(-50%);
  width:520px; background:#f4f3f8; border-radius:26px; padding:30px 34px 34px; text-align:center; }
.restrict-popup .rp-char { width:130px; height:120px; margin:-78px auto 8px; display:block; }
.restrict-msg { font-size:26px; color:#222; margin:14px 0 26px; }
.btn-unlock { display:inline-block; background:#4f63e8; color:#fff; font-size:22px;
  padding:14px 44px; border-radius:30px; }
.zzz { position:absolute; font-size:26px; color:#555; }
.restrict-icon { position:absolute; opacity:.55; }

/* ============ 首页：粉紫渐变 ============ */
#view-home { background:linear-gradient(120deg,#ffb9c8 0%,#e6b7f0 40%,#a9c8f5 100%); }
.home-top { display:flex; align-items:center; gap:18px; padding:22px 30px 6px; }
.avatar { width:58px; height:58px; border-radius:50%; background:#fff; overflow:hidden;
  display:flex; align-items:center; justify-content:center; font-size:26px; }
.profile { background:#ffffff99; border-radius:20px; padding:8px 20px; }
.profile .p-name { font-size:18px; font-weight:700; color:#333; }
.profile .p-grade { font-size:14px; color:#666; }
.coin { background:#ffffff99; border-radius:20px; padding:8px 20px; font-size:20px;
  'font-weight':700; color:#d99a12; display:flex; align-items:center; gap:8px; }
.home-nav { display:flex; align-items:center; gap:26px; margin-left:auto; }
.home-nav .nav-item { font-size:21px; color:#444; padding:6px 4px; white-space:nowrap; position:relative; }
.home-nav .nav-item.active { color:#c0258f; font-weight:800; }
.home-nav .nav-item .tag1v1 { position:absolute; top:-6px; right:-16px; background:#7c6cf0;
  color:#fff; font-size:11px; border-radius:8px; padding:1px 6px; }

.home-main { display:flex; gap:20px; padding:14px 30px; height:610px; }
.home-left { flex:1; display:flex; flex-direction:column; gap:18px; min-width:0; }
.card-row { display:flex; gap:18px; }
.card { border-radius:22px; padding:22px; color:#fff; position:relative; overflow:hidden; }
.card h3 { font-size:26px; margin-bottom:8px; }
.card .big { font-size:40px; font-weight:800; }
.card .sub { font-size:17px; margin-top:6px; opacity:.95; }
.card .time-range { display:inline-block; margin-top:12px; background:#ffffff33;
  'border-radius':14px; padding:5px 14px; font-size:15px; }
.card-blue { flex:1.25; background:linear-gradient(135deg,#3d8bf5,#2f6fe0); min-height:230px; }
.card-orange { flex:1; background:linear-gradient(135deg,#ffb43a,#ff9326); min-height:230px; }
.card-orange .badge { position:absolute; right:16px; top:16px; background:#fff; color:#c8860a;
  'border-radius':14px; padding:8px 12px; font-size:15px; font-weight:700; text-align:center; }
.card-sm { flex:1; border-radius:22px; padding:22px; color:#fff; min-height:190px; position:relative; }
.card-sm h3 { font-size:24px; margin-bottom:8px; }
.card-sm .sub { font-size:16px; opacity:.95; margin-top:6px; }
.card-green { background:linear-gradient(135deg,#39c978,#1fa85e); }
.card-purple { background:linear-gradient(135deg,#b576e8,#8f54d6); }
.card-red { background:linear-gradient(135deg,#f4726b,#e5504a); }
.card-sm .corner { position:absolute; right:16px; top:14px; background:#ffffff33;
  'border-radius':12px; padding:4px 12px; font-size:15px; }

.home-right { width:330px; background:#ffffff77; border-radius:26px; padding:22px; }
.home-right h3 { font-size:24px; color:#2f4fa8; text-align:center; margin-bottom:16px; }
.ai-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.ai-item { background:#fff; border-radius:20px; padding:18px 10px; text-align:center; }
.ai-item .ic { font-size:32px; margin-bottom:6px; }
.ai-item .nm { font-size:17px; color:#333; }
.ai-item .new { position:relative; }
.ai-item .new::after { content:"首创"; position:absolute; top:-6px; left:8px; background:#ffb020;
  color:#fff; font-size:11px; border-radius:8px; padding:1px 6px; }

.dock { display:flex; align-items:center; gap:22px; padding:12px 30px 18px; }
.dock-item { width:84px; text-align:center; }
.dock-item .dic { width:62px; height:62px; border-radius:18px; margin:0 auto 6px;
  display:flex; align-items:center; justify-content:center; font-size:26px; color:#fff; }
.dock-item .dn { font-size:14px; color:#333; }
.dock-mascot { width:84px; text-align:center; }
.dock-mascot .dic { width:74px; height:74px; margin:0 auto; }

/* ============ 二级/三级页面 ============ */
#view-page { background:linear-gradient(120deg,#fdf1f5,#eef2fb); }
.page-top { display:flex; align-items:center; gap:16px; padding:22px 30px; }
.btn-back { width:44px; height:44px; border-radius:14px; background:#fff; font-size:22px;
  display:flex; align-items:center; justify-content:center; color:#333; }
.page-title { font-size:26px; font-weight:800; color:#2b2b2b; }
.page-body { padding:10px 30px 30px; height:720px; overflow-y:auto; }
.breadcrumb { font-size:15px; color:#888; margin-left:8px; }

/* 题型 */
.q-card { background:#fff; border-radius:20px; padding:22px; margin-bottom:18px; }
.q-stem { font-size:20px; color:#222; margin-bottom:16px; line-height:1.6; }
.q-opt { display:block; background:#f3f5fb; border-radius:14px; padding:14px 18px;
  'margin-bottom':10px; font-size:18px; color:#333; border:2px solid transparent; }
.q-opt.right { background:#e2f7ea; border-color:#2fbf6b; color:#157a3d; }
.q-opt.wrong { background:#fde8e8; border-color:#ef5350; color:#c62828; }
.q-analysis { display:none; margin-top:12px; background:#fff8e6; border-radius:14px;
  padding:14px 18px; font-size:16px; color:#6b5310; line-height:1.6; }
.q-analysis.show { display:block; }
.verdict { margin-top:10px; font-size:17px; font-weight:700; }

/* 通用列表/工具 */
.sub-list { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.sub-item { background:#fff; border-radius:18px; padding:22px; text-align:center; font-size:19px;
  color:#333; }
.sub-item .ic { font-size:34px; margin-bottom:8px; }
.tool-panel { background:#fff; border-radius:22px; padding:24px; min-height:480px; }
.btn-main { background:#4f63e8; color:#fff; font-size:18px; padding:12px 30px; border-radius:24px; }
.placeholder-box { background:#f5f7fc; border-radius:18px; padding:30px; text-align:center;
  color:#777; font-size:18px; min-height:300px; display:flex; align-items:center; justify-content:center; }

/* 对话面板 */
.chat-box { background:#fff; border-radius:20px; padding:18px; height:420px; overflow-y:auto; margin-bottom:14px; }
.msg { max-width:75%; margin-bottom:14px; padding:12px 16px; border-radius:16px; font-size:17px; line-height:1.5; }
.msg.me { background:#4f63e8; color:#fff; margin-left:auto; }
.msg.ai { background:#f0f2fa; color:#222; }
.chat-input { display:flex; gap:12px; }
.chat-input input { flex:1; border:2px solid #e2e6f5; border-radius:16px; padding:12px 16px; font-size:17px; }

/* 应用商店进度 */
.store-item { display:flex; align-items:center; gap:16px; background:#fff; border-radius:18px;
  padding:18px; margin-bottom:14px; }
.store-item .sic { width:52px; height:52px; border-radius:14px; background:#eef2fb;
  display:flex; align-items:center; justify-content:center; font-size:24px; }
.store-item .snm { font-size:19px; font-weight:700; }
.store-item .sdesc { font-size:14px; color:#888; }
.progress { flex:1; height:10px; background:#eef0f7; border-radius:6px; overflow:hidden; margin:0 16px; }
.progress > i { display:block; height:100%; width:0; background:#4f63e8; border-radius:6px; }

/* toast */
#toast { position:absolute; left:50%; bottom:120px; transform:translateX(-50%);
  background:rgba(20,20,30,.85); color:#fff; font-size:18px; padding:12px 26px; border-radius:20px;
  opacity:0; pointer-events:none; transition:opacity .25s; z-index:99; }
#toast.show { opacity:1; }

/* 小屏手机横屏提示与缩放由 JS 处理 */
</style>
</head>
<body>
<div id="stage">

  <!-- ===== 视图：锁屏 ===== -->
  <section id="view-lock">
    <div id="stars"></div>
    <div id="lock-decos"></div>
    <div class="lock-time" id="lock-time">--:--</div>

  <section id="view-restrict">

      <button class="btn-unlock" id="btn-request-unlock">向家长申请解锁</button>
    </div>

  <!-- ===== 视图：首页 ===== -->
  <section id="view-home">
    <div class="home-top">
      <div class="avatar">👤</div>
      <div class="profile"><div class="p-name">赖梓萱</div><div class="p-grade">四年级</div></div>
      <div class="coin">🪙 564</div>

<script>
/* ==================== 基础状态与舞台缩放 ==================== */
const $ = s => document.querySelector(s);
const STAGE_W = 1180, STAGE_H = 820;
function fitStage(){
  const s = Math.min(innerWidth / STAGE_W, innerHeight / STAGE_H);
  $('#stage').style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fitStage); fitStage();

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ==================== 顶部导航 / Dock / AI 工具配置 ==================== */
const NAV_TOP = [
  {id:'faq', name:'作业辅导'},
  {id:'diagnosis', name:'诊断规划', tag:'1对1'},
  {id:'math', name:'数学'},
  {id:'chinese', name:'语文'},
  {id:'english', name:'英语'},
  {id:'literacy', name:'素养'},
  {id:'apps', name:'精选应用'}
];
const AI_TOOLS = [
  {id:'ai-camera', name:'AI智能拍题', ic:'📷', first:true},
  {id:'ai-deepseek', name:'Deepseek问答', ic:'🐳'},
  {id:'ai-enwrite', name:'英语作文批改', ic:'✍️'},
  {id:'ai-pk', name:'口算PK', ic:'PK'},
  {id:'ai-wordgame', name:'单词大闯关', ic:'🔤'},
  {id:'ai-dictation', name:'单词听写', ic:'🎧'}
];
const DOCK = [
  {id:'dock-lesson', name:'名师课', ic:'📖'},
  {id:'dock-golden', name:'练习', ic:'📚'},
  {id:'dock-read', name:'中小学阅读', ic:'📗'},
  {id:'dock-listen', name:'畅听学堂', ic:'🎵'},
  {id:'dock-store', name:'应用商店', ic:'🛍️'},
  {id:'dock-precision', name:'AI精准练', ic:'🎯'},
  {id:'dock-pass', name:'AI通关练', ic:'🐸'},
  {id:'dock-pass2', name:'AI通关统', ic:'🍊'}
];

/* ==================== 题库（点选即时判定 + 解析） ==================== */
const BANK = {
  kousuan: [
    {stem:'36 + 27 = ？', options:['53','63','73'], answer:1, analysis:'36+27=63，个位 6+7=13 进一，十位 3+2+1=6。'},
    {stem:'84 - 39 = ？', options:['45','55','44'], answer:0, analysis:'84-39=45，个位不够减，向十位借一当十。'},
    {stem:'7 × 8 = ？', options:['54','56','63'], answer:1, analysis:'根据乘法口诀七八五十六。'}
  ],
  shushi: [
    {stem:'列竖式：48 + 35 结果是？', options:['73','83','93'], answer:1, analysis:'48+35=83，个位 8+5=13 进一，十位 4+3+1=8。'},
    {stem:'列竖式：62 - 28 结果是？', options:['34','44','24'], answer:0, analysis:'62-28=34，个位 2 减 8 不够，借位后 12-8=4。'}
  ],
  tuoshi: [
    {stem:'脱式计算：25 + 15 × 4 = ？', options:['160','85','100'], answer:1, analysis:'先乘后加：15×4=60，25+60=85。'},
    {stem:'脱式计算：(30 - 12) ÷ 6 = ？', options:['2','3','18'], answer:0, analysis:'先算括号：30-12=18，再算 18÷6=3？注意：18÷6=3，答案应为 3。'}
  ],
  kantu: [
    {stem:'看图：左边 5 个苹果，右边 7 个苹果，一共几个？', options:['11','12','13'], answer:1, analysis:'5+7=12，求总数用加法。'},
    {stem:'看图：一共 14 颗糖，吃掉 6 颗，还剩几颗？', options:['7','8','9'], answer:1, analysis:'14-6=8，求剩余用减法。'}
  ],
  jiejue: [
    {stem:'小明有 3 盒铅笔，每盒 8 支，一共有多少支？', options:['11','24','32'], answer:1, analysis:'3×8=24（支），求几个几是多少用乘法。'},
    {stem:'一本书 60 页，每天看 8 页，看了 5 天，还剩多少页？', options:['20','40','12'], answer:0, analysis:'已看 8×5=40 页，60-40=20 页。'}
  ],
  zhuanci: [
    {stem:'下面词语中，没有错别字的一项是？', options:['已后','以后','以经'], answer:1, analysis:'正确写法是“以后”；“已”是已经的已，“以”用以、以后。'},
    {stem:'“闻”在“新闻”中的意思是？', options:['听见','消息','用鼻子嗅'], answer:1, analysis:'“新闻”指新近发生的消息，引申义。'}
  ],
  yuedu: [
    {stem:'短文写了哪种小动物？（阅读课示例：小猫）', options:['小狗','小猫','小兔'], answer:1, analysis:'抓住短文反复描写的主体，即小猫。'},
    {stem:'文中“开心”一词近义词是？', options:['难过','高兴','生气'], answer:1, analysis:'开心与高兴意思相近。'}

/* ==================== 题目渲染 ==================== */
function renderQuiz(bankKey){
  const list = BANK[bankKey] || [];
  if (!list.length) return '<div class="placeholder-box">暂无题目</div>';
  return list.map((q, qi) => `
    <div class="q-card" data-q="${qi}">
      <div class="q-stem">${qi+1}. ${q.stem}</div>
      ${q.options.map((o, oi) => `<button class="q-opt" data-oi="${oi}">${String.fromCharCode(65+oi)}. ${o}</button>`).join('')}
      <div class="verdict"></div>
      <div class="q-analysis">解析：${q.analysis}</div>
    </div>`).join('');
}

function bindQuiz(container, bankKey){
  const list = BANK[bankKey] || [];
  container.querySelectorAll('.q-card').forEach(card => {
    const qi = +card.dataset.q; const q = list[qi]; if(!q) return;
    const verdict = card.querySelector('.verdict');
    card.querySelectorAll('.q-opt').forEach(opt => {
      opt.onclick = () => {
        const oi = +opt.dataset.oi;
        card.querySelectorAll('.q-opt').forEach(o => o.classList.remove('right','wrong'));
        if (oi === q.answer) {
          opt.classList.add('right'); verdict.textContent='✓ 回答正确'; verdict.style.color='#157a3d';
        } else {
          opt.classList.add('wrong');
          card.querySelectorAll('.q-opt')[q.answer].classList.add('right');
          verdict.textContent='✗ 回答错误'; verdict.style.color='#c62828';
        }
        card.querySelector('.q-analysis').classList.add('show');
      };
    });
  });
}

function showPage(id){
  const r = ROUTES[id]; if(!r){ toast('页面建设中'); return; }
  if (currentPage !== 'home') pageStack.push(currentPage);
  currentPage = id;
  $('#page-title').textContent = r.title;
  $('#page-crumb').textContent = r.crumb ? ' / '+r.crumb : '';
  const body = $('#page-body');
  if (r.type === 'list') {
    body.innerHTML = `<div class="sub-list">` + r.items.map(it =>
      `<div class="sub-item" data-nav="${it.id}"><div class="ic">${it.ic||'📄'}</div>${it.name}</div>`).join('') + `</div>`;
  } else if (r.type === 'quiz') {
    body.innerHTML = renderQuiz(r.bank);
    bindQuiz(body, r.bank);
  } else if (r.type === 'panel') {
    body.innerHTML = `<div class="tool-panel"><div class="q-stem">${r.title}</div><div class="placeholder-box">${r.text}</div></div>`;
  } else if (r.type === 'tool') {
    renderTool(body, r.tool, r);
  }
  renderNav();
  showView('view-page');
}

function goBack(){
  const prev = pageStack.pop();
  if (!prev) { currentPage='home'; renderNav(); showView('view-home'); return; }
  showPage(prev);
}

/* ==================== 时间刷新与 9 点锁定监测 ==================== */
const URL_HOUR = new URLSearchParams(location.search).get('hour');
let unlockAt = 0; // 解锁宽限时间戳
const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];

function nowHour(){ return URL_HOUR ? +URL_HOUR : new Date().getHours(); }
function fmtTime(d){
  const h=String(d.getHours()).padStart(2,'0'), m=String(d.getMinutes()).padStart(2,'0');
  return `${h}:${m}`;
}
function fmtDate(d){ return `${d.getMonth()+1}月${d.getDate()}日 ${WEEK[d.getDay()]}`; }

function tick(){
  const d = new Date();
  $('#lock-time').textContent = fmtTime(d);
  $('#lock-date').textContent = fmtDate(d);
  $('#restrict-time').textContent = fmtTime(d);
  // 9 点强制锁定（参数 ?hour=9 可立即触发）；解锁后 10 分钟内不重复弹出
  const locked = nowHour() === 9;
  const grace = Date.now() - unlockAt < 10*60*1000;
  if (locked && !grace) { showView('view-restrict'); }
}
setInterval(tick, 1000); tick();

$('#btn-request-unlock').onclick = () => {
  unlockAt = Date.now();
  toast('已向家长申请解锁，10 分钟内可使用');
  showView('view-home'); renderNav();
};

/* ==================== 锁屏：仅自下向上滑动解锁 ==================== */
let touchY = null;
const lockView = $('#view-lock');
lockView.addEventListener('touchstart', e => touchY = e.touches[0].clientY, {passive:true});
lockView.addEventListener('touchend', e => {
  if (touchY !== null && touchY - e.changedTouches[0].clientY > 40) {
    if (nowHour() !== 9) { showView('view-home'); renderNav(); }
    else toast('休息时间，请先向家长申请解锁');
  }
  touchY = null;
});
let mouseY = null;
lockView.addEventListener('mousedown', e => mouseY = e.clientY);
lockView.addEventListener('mouseup', e => {
  if (mouseY !== null && mouseY - e.clientY > 40) {
    if (nowHour() !== 9) { showView('view-home'); renderNav(); }
    else toast('休息时间，请先向家长申请解锁');
  }
  mouseY = null;
});

    if (/你好|嗨|hello/i.test(q)) return '你好呀，很高兴为你解答！';
    if (/天气|时间|几点/.test(q)) return '这是演示对话，真实联网回答需接入 DeepSeek API Key。';
    if (/作文|写作/.test(q)) return '写作文可以先列提纲：开头点题、中间两件事、结尾抒情。';
    return '收到你的问题：“'+q+'”。演示模式下为本地回复，接入 API 后可获得智能解答。';
  };
  const push = (t, me) => {
    const d = document.createElement('div'); d.className='msg '+(me?'me':'ai'); d.textContent=t;
    box.appendChild(d); box.scrollTop = box.scrollHeight;
  };
  const send = () => {
    const v = input.value.trim(); if(!v){ toast('请先输入问题'); return; }
    push(v, true); input.value='';
    setTimeout(()=>push(reply(v)), 400);
  };
  body.querySelector('#ds-send').onclick = send;
  input.onkeydown = e => { if(e.key==='Enter') send(); };
};

/* ---- 口算 PK：双人轮流 + 60 秒计时 + 正确率 ---- */
function renderPk(){
  return `<h3 style="font-size:22px;margin-bottom:16px">口算 PK（双人轮流 · 60 秒）</h3>
    <div style="display:flex;gap:16px;margin-bottom:14px">
      <div class="sub-item" style="flex:1">玩家 A<br><b id="pk-a">0</b> 题</div>
      <div class="sub-item" style="flex:1">玩家 B<br><b id="pk-b">0</b> 题</div>
      <div class="sub-item" style="flex:1">倒计时<br><b id="pk-time">60</b> 秒</div>
    </div>
    <div class="q-card" id="pk-card">
      <div class="q-stem" id="pk-q">点击开始</div>
      <div id="pk-opts"></div>
      <div class="verdict" id="pk-verdict"></div>
    </div>
    <button class="btn-main" id="pk-start">开始 PK</button>
    <div id="pk-end" style="margin-top:14px"></div>`;
}
renderPk.bind = function(body){
  let turn=0, score=[0,0], total=[0,0], time=60, timer=null, cur=null;
  const $b = s => body.querySelector(s);
  const gen = () => {
    const op = Math.random()<.5?'+':'-';
    let a = 5+Math.floor(Math.random()*20), b = 3+Math.floor(Math.random()*15);
    if(op==='-' && b>a){[a,b]=[b,a];}
    const ans = op==='+'?a+b:a-b;
    const opts = new Set([ans]);
    while(opts.size<3) opts.add(Math.max(1, ans + Math.floor(Math.random()*7)-3));
    return {q:`${a} ${op} ${b} = ？`, ans, opts:[...opts].sort(()=>Math.random()-.5)};
  };
  const ask = () => {
    cur = gen();
    $b('#pk-q').textContent = `玩家 ${turn?'B':'A'}：${cur.q}`;
    $b('#pk-verdict').textContent='';
    $b('#pk-opts').innerHTML = cur.opts.map(o=>`<button class="q-opt" data-v="${o}">${o}</button>`).join('');
    $b('#pk-opts').querySelectorAll('.q-opt').forEach(btn=>{
      btn.onclick = () => {
        total[turn]++;
        if(+btn.dataset.v===cur.ans){ score[turn]++; $b('#pk-verdict').textContent='✓ 正确'; $b('#pk-verdict').style.color='#157a3d'; }
        else { $b('#pk-verdict').textContent='✗ 错误，答案 '+cur.ans; $b('#pk-verdict').style.color='#c62828'; }
        $b('#pk-a').textContent=score[0]; $b('#pk-b').textContent=score[1];
        turn = 1-turn; ask();
      };
    });
  };
  $b('#pk-start').onclick = () => {
    if(timer) return;
    turn=0; score=[0,0]; total=[0,0]; time=60; $b('#pk-time').textContent=60;
    ask();
    timer = setInterval(()=>{
      time--; $b('#pk-time').textContent=time;
      if(time<=0){
        clearInterval(timer); timer=null;
        const acc = i => total[i]? Math.round(score[i]/total[i]*100)+'%':'—';
        $b('#pk-end').innerHTML = `<div class="q-card"><div class="q-stem">PK 结束</div>
          <div class="verdict">玩家 A：${score[0]} 题，正确率 ${acc(0)}；玩家 B：${score[1]} 题，正确率 ${acc(1)}</div></div>`;
        $b('#pk-q').textContent='时间到'; $b('#pk-opts').innerHTML='';
      }
    },1000);
  };
};

renderWordgame.bind = function(body){
  const data = [
    {q:'“cat” 是？', opts:['猫','狗','鸟'], ans:0},
    {q:'“dog” 是？', opts:['猫','狗','鱼'], ans:1},
    {q:'“sun” 是？', opts:['月亮','星星','太阳'], ans:2},
    {q:'“book” 是？', opts:['书','笔','桌子'], ans:0},
    {q:'“red” 是？', opts:['蓝色','红色','绿色'], ans:1}
  ];
  let unlocked = 1, cur = -1;
  const $b = s => body.querySelector(s);
  const draw = () => {
    $b('#wg-levels').innerHTML = data.map((_,i)=>
      `<button class="sub-item" style="flex:1;${i+1>unlocked?'opacity:.4;pointer-events:none':''}" data-lv="${i}">第 ${i+1} 关</button>`).join('');
    $b('#wg-levels').querySelectorAll('[data-lv]').forEach(b=> b.onclick=()=>{ cur=+b.dataset.lv; ask(); });
  };
  const ask = () => {
    const d = data[cur];
    $b('#wg-q').textContent = `第 ${cur+1} 关：${d.q}`;
    $b('#wg-v').textContent='';
    $b('#wg-opts').innerHTML = d.opts.map((o,i)=>`<button class="q-opt" data-i="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('');
    $b('#wg-opts').querySelectorAll('.q-opt').forEach(btn=>{
      btn.onclick = () => {
        if(+btn.dataset.i===d.ans){
          btn.classList.add('right'); $b('#wg-v').textContent='✓ 过关！'; $b('#wg-v').style.color='#157a3d';
          unlocked = Math.max(unlocked, cur+2); draw();
        } else {
          btn.classList.add('wrong'); $b('#wg-v').textContent='✗ 再试一次'; $b('#wg-v').style.color='#c62828';
        }
      };
    });
  };
  draw();
};

/* ---- Canvas 画板 ---- */
function renderBoard(){
  return `<h3 style="font-size:22px;margin-bottom:16px">Canvas 画板</h3>
    <canvas id="board-cv" width="1000" height="380" style="width:100%;height:300px;background:#fff;border-radius:18px;border:2px solid #e2e6f5"></canvas>
    <div style="margin-top:14px;display:flex;gap:10px;align-items:center">
      <button class="btn-main" data-color="#222" style="background:#222">黑</button>
      <button class="btn-main" data-color="#e5504a" style="background:#e5504a">红</button>
      <button class="btn-main" data-color="#2f7fd6" style="background:#2f7fd6">蓝</button>
      <button class="btn-main" data-color="#2fbf6b" style="background:#2fbf6b">绿</button>
      <button class="btn-main" id="board-clear" style="background:#889">清除</button>
    </div>`;
}
renderBoard.bind = function(body){
  const cv = body.querySelector('#board-cv'), ctx = cv.getContext('2d');
  let drawing=false, color='#222';
  const pos = e => { const r=cv.getBoundingClientRect(); const p=e.touches?e.touches[0]:e;
    return {x:(p.clientX-r.left)*cv.width/r.width, y:(p.clientY-r.top)*cv.height/r.height}; };
  const start = e => { drawing=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); };
  const move = e => { if(!drawing) return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.strokeStyle=color; ctx.lineWidth=6; ctx.lineCap='round'; ctx.stroke(); };
  const end = () => drawing=false;
  cv.addEventListener('mousedown',start); cv.addEventListener('mousemove',move); addEventListener('mouseup',end);
  cv.addEventListener('touchstart',e=>{start(e);e.preventDefault();},{passive:false});
  cv.addEventListener('touchmove',e=>{move(e);e.preventDefault();},{passive:false});
  cv.addEventListener('touchend',end);
  body.querySelectorAll('[data-color]').forEach(b=> b.onclick=()=> color=b.dataset.color);
  body.querySelector('#board-clear').onclick = () => ctx.clearRect(0,0,cv.width,cv.height);
};
