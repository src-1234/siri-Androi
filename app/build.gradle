// ==================== app 模块构建脚本 ====================
plugins {
    id 'com.android.application'
}

// ---- 读取签名配置（signing.properties 不入库）----
def signingProps = new Properties()
def signingFile = rootProject.file('signing.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { signingProps.load(it) }
}

android {
    namespace 'com.qwenwork.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.qwenwork.app"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            if (signingProps.containsKey('storeFile')) {
                storeFile rootProject.file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
