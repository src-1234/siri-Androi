<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<title>悟空</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f7f8fa;color:#222}
button{border:none;background:none;cursor:pointer;font-family:inherit;color:inherit}
.view{display:none;height:100%;flex-direction:column;overflow:hidden}
.view.active{display:flex}
.spacer{flex:1}
/* ---------- home ---------- */
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:14px;padding:14px 16px 0}
.iconbtn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.iconbtn:active{background:#ececec}
.home-body{flex:1;overflow-y:auto;padding:0 16px}
.hero{font-size:22px;font-weight:700;text-align:center;margin:44px 0 34px}
.inputcard{position:relative;background:#fff;border-radius:18px;box-shadow:0 2px 12px rgba(0,0,0,.06);padding:14px 14px 12px}
.inputcard textarea{width:100%;border:none;outline:none;resize:none;font-size:15px;line-height:1.5;min-height:44px;max-height:120px;background:transparent;color:#222}
.inputcard textarea::placeholder{color:#b8b8b8}
.row{display:flex;align-items:center;gap:10px;margin-top:10px}
.cbtn{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid #ececec;display:flex;align-items:center;justify-content:center}
.cbtn:active{background:#f2f2f2}
.modebtn{display:flex;align-items:center;gap:4px;border:1px solid #e4e4e4;border-radius:999px;padding:8px 14px;font-size:14px;background:#fff}
.sendbtn{width:42px;height:42px;border-radius:50%;background:#d8d8d8;display:flex;align-items:center;justify-content:center;transition:background .2s}
.sendbtn.on{background:#00b96b}
.modemenu{position:absolute;right:60px;bottom:62px;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.14);display:none;min-width:190px;overflow:hidden;z-index:20}
.modemenu.show{display:block}
.modemenu div{padding:12px 16px;font-size:14px;text-align:left}
.modemenu div:active{background:#f4f4f4}
.modemenu div.sel{color:#00b96b;font-weight:600}
.attach{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.attach img{width:52px;height:52px;border-radius:8px;object-fit:cover;border:1px solid #eee}
.attach .x{width:20px;height:20px;border-radius:50%;background:#eee;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
.cases-head{display:flex;justify-content:space-between;align-items:center;margin:30px 2px 14px;font-size:16px;font-weight:700}
.cases-head .more{font-size:13px;font-weight:400;color:#666}
.case{height:150px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:34px}
.case .emojis{font-size:16px;letter-spacing:10px}
.case.g{background:linear-gradient(135deg,#eaf6ec,#f3faf1)}
.case.b{background:linear-gradient(135deg,#e8f0fb,#f0f6fd)}
.case-label{font-size:15px;font-weight:700;margin:12px 2px 22px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #f0f0f0;display:flex;justify-content:center;padding:6px 0 10px;z-index:10}
.tabbar .tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#333}
.tabbar img{width:34px;height:34px;border-radius:50%}
/* ---------- chat ---------- */
.chat-head{display:flex;align-items:center;gap:8px;padding:12px 10px;background:#fff;border-bottom:1px solid #f0f0f0}
.chat-head .back{font-size:26px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#333}
.ct{flex:1;min-width:0}
.ct .t1{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct .t2{font-size:11px;color:#999;margin-top:1px}
.msgs{flex:1;overflow-y:auto;padding:16px 14px 8px}
.mrow{display:flex;gap:10px;margin-bottom:18px;align-items:flex-start}
.mrow.user{flex-direction:row-reverse}
.uav{width:36px;height:36px;border-radius:50%;background:#00b96b;color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.aav{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#fff}
.bub{max-width:76%;background:#fff;border-radius:14px;padding:10px 14px;font-size:15px;line-height:1.65;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.mrow.user .bub{background:#00b96b;color:#fff}
.bub img.msgimg{max-width:100%;border-radius:10px;display:block;margin-top:6px}
.bub .think{color:#888;font-size:13px;display:block;margin-bottom:6px}
.dots{display:inline-flex;gap:5px;padding:6px 2px}
.dots i{width:7px;height:7px;border-radius:50%;background:#bbb;animation:bl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.chat-input{padding:8px 12px 12px;background:#f7f8fa}
/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;z-index:60}
.ov.show{display:flex}
.ov.sheet{align-items:flex-end}
.sheetbox{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:18px 18px 26px;max-height:70%;overflow-y:auto}
.sheetbox h3{font-size:16px;margin-bottom:14px}
.mitem{display:flex;justify-content:space-between;align-items:center;padding:13px 6px;font-size:15px;border-bottom:1px solid #f5f5f5}
.mitem .ck{color:#00b96b;font-weight:700}
.panel{margin-left:auto;width:84%;max-width:340px;height:100%;background:#fff;display:flex;flex-direction:column;animation:sl .18s ease-out}
@keyframes sl{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.panel .ph{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid #f2f2f2}
.panel .ph h3{flex:1;font-size:16px}
.panel .list{flex:1;overflow-y:auto;padding:8px}
.hitem{padding:12px 12px;border-radius:10px}
.hitem:active{background:#f5f5f5}
.hitem .h1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hitem .h2{font-size:11px;color:#999;margin-top:3px}
.loginbtn{margin:12px 16px;padding:11px;border-radius:999px;background:#00b96b;color:#fff;font-size:15px;text-align:center}
.userchip{margin:12px 16px;padding:10px 14px;border-radius:12px;background:#f2faf6;color:#00875a;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.empty{color:#aaa;font-size:13px;text-align:center;margin-top:40px}
/* login */
.ov.center{align-items:center;justify-content:center}
.lcard{width:86%;max-width:360px;background:#fff;border-radius:20px;padding:22px 20px}
.lcard h3{font-size:18px;text-align:center;margin-bottom:16px}
.ltabs{display:flex;gap:6px;background:#f4f4f4;border-radius:10px;padding:4px;margin-bottom:16px}
.ltabs button{flex:1;padding:8px 0;border-radius:8px;font-size:13px;color:#666}
.ltabs button.on{background:#fff;color:#222;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.linp{width:100%;border:1px solid #e6e6e6;border-radius:10px;padding:11px 12px;font-size:14px;margin-bottom:10px;outline:none}
.linp:focus{border-color:#00b96b}
.lrow{display:flex;gap:8px}
.lrow .linp{flex:1}
.codebtn{border:1px solid #00b96b;color:#00b96b;border-radius:10px;padding:0 12px;font-size:13px;white-space:nowrap}
.lmain{width:100%;padding:12px 0;border-radius:10px;background:#00b96b;color:#fff;font-size:15px;margin-top:4px}
.qrbox{text-align:center;padding:6px 0}
.qrbox img{width:180px;height:180px;border:1px solid #eee;border-radius:10px}
.qrstatus{font-size:13px;color:#666;margin-top:10px}
.lclose{position:absolute;top:14px;right:16px;font-size:22px;color:#999}
/* settings */
.setdesc{font-size:12px;color:#888;line-height:1.7;margin:8px 0 12px}
.danger{color:#e64340;text-align:center;padding:12px 0;font-size:14px}
/* toast */
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;font-size:13px;padding:9px 16px;border-radius:8px;display:none;z-index:99;max-width:80%;text-align:center}
</style>
</head>

$('#btn-lclose').onclick=function(){qrTimers.forEach(clearTimeout);qrTimers=[];$('#ov-login').classList.remove('show')};
function switchLogin(t){$$('.ltabs button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-t')===t)});
 $('#lt-mail').style.display=t==='mail'?'block':'none';$('#lt-phone').style.display=t==='phone'?'block':'none';$('#lt-qr').style.display=t==='qr'?'block':'none';
 if(t==='qr')startQR()}
$$('.ltabs button').forEach(function(b){b.onclick=function(){switchLogin(b.getAttribute('data-t'))}});
$('#mail-send').onclick=function(){var v=$('#mail-inp').value.trim();if(!/.+@.+\..+/.test(v))return toast('请输入正确邮箱');toast('验证码已发送（体验版：任意6位数字即可）')};
$('#phone-send').onclick=function(){var v=$('#phone-inp').value.trim();if(!/^1\d{10}$/.test(v))return toast('请输入11位手机号');toast('验证码已发送（体验版：任意6位数字即可）')};
$('#mail-login').onclick=function(){var v=$('#mail-inp').value.trim(),c=$('#mail-code').value.trim();if(!/.+@.+\..+/.test(v))return toast('请输入正确邮箱');if(!/^\d{6}$/.test(c))return toast('请输入6位验证码');doLogin(v.split('@')[0],'邮箱')};
$('#phone-login').onclick=function(){var v=$('#phone-inp').value.trim(),c=$('#phone-code').value.trim();if(!/^1\d{10}$/.test(v))return toast('请输入11位手机号');if(!/^\d{6}$/.test(c))return toast('请输入6位验证码');doLogin(v.slice(-4),'手机号')};
function startQR(){var sid='wk'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
 $('#qr-img').src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent('https://login.dingtalk.com/oauth2/auth?session='+sid);
 $('#qr-status').textContent='请使用钉钉扫一扫登录';
 qrTimers.push(setTimeout(function(){$('#qr-status').textContent='已扫码，请在手机上确认…'},4000));
 qrTimers.push(setTimeout(function(){doLogin('钉钉用户','钉钉扫码')},6500))}
function doLogin(name,method){user={name:name,method:method};LS.set('wk_user',user);qrTimers.forEach(clearTimeout);qrTimers=[];$('#ov-login').classList.remove('show');renderHistory();toast('登录成功：'+name)}
/* ---------- send & AI ---------- */
function activeTa(){return $('#view-chat').classList.contains('active')?$('#ta-chat'):$('#ta-home')}
function send(){if(busy)return;var ta=activeTa();var text=ta.value.trim();
 if(!text&&!pendingImage)return toast('说点什么吧');
 if(!$('#view-chat').classList.contains('active')){if(!cur()||cur().messages.length){newConvo()}show('#view-chat')}
 var c=cur();if(!c){convos.unshift({id:'c'+Date.now(),title:'',created:Date.now(),messages:[]});curId=convos[0].id;c=cur()}
 if(pendingImage&&!model().vision){modelId='openai/gpt-4o';LS.set('wk_model',modelId);toast('已自动切换到 GPT-4o（视觉）')}
 var msg={role:'user',content:text||(pendingImage?'请解读这张图片':''),image:pendingImage||undefined};
 c.messages.push(msg);if(!c.title)c.title=(text||'图片解读').slice(0,18);
 ta.value='';pendingImage=null;syncAttach();syncSend();
 renderMsgs();openConvo(curId);save();
 askAI(c)}
function buildBody(c){var msgs=[{role:'system',content:SYS+(mode==='advanced'?ADV:'')}];
 c.messages.forEach(function(m){if(m.role==='user'){if(m.image){msgs.push({role:'user',content:[{type:'text',text:m.content},{type:'image_url',image_url:{url:m.image}}]})}else{msgs.push({role:'user',content:m.content})}}else{msgs.push({role:'assistant',content:m.content})}});
 var body={model:modelId,messages:msgs};
 if(modelId.indexOf('/o1')<0&&modelId.indexOf('/o3')<0&&modelId.indexOf('/o4')<0){body.temperature=mode==='advanced'?0.3:0.7;body.max_tokens=2048}
 return body}
function demoReply(c){var last='';for(var i=c.messages.length-1;i>=0;i--){if(c.messages[i].role==='user'){last=c.messages[i].content;break}}
 if(c.messages.some(function(m){return m.image}))return '（体验模式）我看到你上传的图片啦。配置 GitHub Token 后，我会调用视觉模型为你真正解读它的内容。';
 if(/你好|在吗|hi|hello/i.test(last))return '你好呀！我是悟空，你的AI工作平台助手。写文案、做计划、解读图片、梳理资料都可以交给我。想让我干点什么？';
 if(/你是谁|名字|介绍/.test(last))return '我是悟空，AI工作平台助手。当前界面为完整可交互版本；接入 GitHub Token 后，我的回答将由 GitHub Models 上的大模型实时生成。';
 return '（体验模式）收到：「'+last+'」\n界面与对话流程已全部跑通。到 右上角菜单 → 设置 中填入你的 GitHub Token，我就能调用 GitHub Models 给你真实、完整的回答。'}
function askAI(c){busy=true;pushThinking();
 var token=LS.get('wk_token','');
 function finish(content){var t=$('#thinking');if(t)t.remove();c.messages.push({role:'assistant',content:content});save();renderMsgs();busy=false}
 if(!token){setTimeout(function(){finish(demoReply(c))},mode==='advanced'?1600:800);return}
 var payload={url:API_URL,token:token,body:buildBody(c)};
 if(window.WukongBridge){setTimeout(function(){try{var r=JSON.parse(window.WukongBridge.aiRequest(JSON.stringify(payload)));
   if(r.ok){var d=JSON.parse(r.text);finish(d.choices&&d.choices[0]?d.choices[0].message.content:'（模型未返回内容）')}
   else{var em='';try{em=JSON.parse(r.text).error?JSON.parse(r.text).error.message:''}catch(e){}finish('请求失败（HTTP '+r.status+'）：'+(em||r.text||r.error||'网络错误')+'\n请检查 Token 是否有效、网络是否可用。')}}catch(e){finish('调用失败：'+e.message)}},60);return}
 fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(payload.body)})
  .then(function(r){return r.json().then(function(d){return{st:r.status,d:d}})})
  .then(function(o){if(o.d.choices&&o.d.choices[0])finish(o.d.choices[0].message.content);else finish('请求失败（HTTP '+o.st+'）：'+(o.d.error&&o.d.error.message||'未知错误'))})
  .catch(function(e){finish('网络请求失败：'+e.message)});}
/* ---------- init ---------- */
$$('.mlabel').forEach(function(l){l.textContent=mode==='advanced'?'高级':'标准'});
renderHistory();syncSend();
</script>
</body>
</html>
